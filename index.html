<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>万能青年旅店 · NFC音乐盒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', 'Noto Sans CJK SC', serif;
            padding: 20px;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 20px 20px 30px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }
        .cover {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            background: #1e2a3a;
        }
        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .vinyl {
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
            background: radial-gradient(circle at 30% 35%, #333, #000);
            border-radius: 50%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5), inset 0 0 0 4px rgba(255,215,0,0.3), inset 0 0 0 10px #2a2a2a;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vinyl:active { transform: scale(0.97); }
        .vinyl-center {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #e0b341, #8b691b);
            border-radius: 50%;
        }
        .song-title {
            font-size: 26px;
            font-weight: 600;
            color: #f3e7c9;
            margin-bottom: 5px;
        }
        .band {
            font-size: 14px;
            color: #c0b28a;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .message {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 8px 12px;
            margin: 10px 15px;
            font-size: 13px;
            color: #ffecb3;
            font-style: italic;
            border-left: 3px solid #dbb42c;
        }
        .lyric-container {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 12px;
            margin: 10px 0;
            height: 220px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .lyric-line {
            font-size: 14px;
            color: #aaa;
            text-align: center;
            padding: 6px 0;
            transition: all 0.2s ease;
            line-height: 1.5;
        }
        .lyric-line.active {
            color: #dbb42c;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 2px #ffd700;
        }
        .play-btn {
            background: #dbb42c;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 10px auto;
            cursor: pointer;
            font-size: 28px;
            color: #1e2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }
        .play-btn:active { transform: scale(0.96); }
        .status {
            margin-top: 12px;
            font-size: 12px;
            color: #afaa8a;
        }
        footer {
            margin-top: 16px;
            font-size: 10px;
            color: #5e5a48;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="cover" id="coverContainer">
        <img id="coverImg" src="cover.jpg" alt="cover" onerror="this.src='https://placehold.co/200x200/1e2a3a/dbb42c?text=万能青年旅店'">
    </div>
    <div class="vinyl" id="vinylDisc">
        <div class="vinyl-center"></div>
    </div>
    <div class="song-title" id="songTitle">万能青年旅店</div>
    <div class="band" id="band">触碰NFC · 小号响起</div>
    <div class="message" id="messageBox">加载中...</div>
    <div class="lyric-container" id="lyricContainer">
        <div class="lyric-line">准备就绪</div>
    </div>
    <button class="play-btn" id="playBtn">▶</button>
    <div class="status" id="statusMsg">触碰卡片或点击唱片</div>
    <footer>NFC 音乐感应 · 万能青年旅店</footer>
</div>

<script>
    // ============================================================
    // 歌曲列表（共17首）
    // 修改 message 字段即可定制个性化留言
    // ============================================================
    const songs = {
        1: { file: "01.mp3", title: "不万能的喜剧", lyricFile: "01.lrc", cover: "01.jpg", message: "送给[朋友名字]，愿你的喜剧永远不万能" },
        2: { file: "02.mp3", title: "大石碎胸口", lyricFile: "02.lrc", cover: "02.jpg", message: "胸口碎大石，友谊坚如石" },
        3: { file: "03.mp3", title: "狗尿馆", lyricFile: "03.lrc", cover: "03.jpg", message: "狗尿馆里也有诗意" },
        4: { file: "04.mp3", title: "揪心的玩笑与漫长的白日梦", lyricFile: "04.lrc", cover: "04.jpg", message: "来自山川湖海，别困于昼夜厨房" },
        5: { file: "05.mp3", title: "秦皇岛", lyricFile: "05.lrc", cover: "05.jpg", message: "站在能分割世界的桥，听见小号" },
        6: { file: "06.mp3", title: "杀死那个石家庄人", lyricFile: "06.lrc", cover: "06.jpg", message: "大厦崩塌后，还有我们在" },
        7: { file: "07.mp3", title: "十万嬉皮", lyricFile: "07.lrc", cover: "07.jpg", message: "大梦一场，推开窗户" },
        8: { file: "08.mp3", title: "洋鸟消夏录", lyricFile: "08.lrc", cover: "08.jpg", message: "山谷里的秘语" },
        9: { file: "09.mp3", title: "早", lyricFile: "09.lrc", cover: "09.jpg", message: "清晨的阳光照" },
        10: { file: "10.mp3", title: "泥河", lyricFile: "10.lrc", cover: "10.jpg", message: "泥河奔流，生命不息" },
        11: { file: "11.mp3", title: "平等云雾", lyricFile: "11.lrc", cover: "11.jpg", message: "云雾平等笼罩每一个人" },
        12: { file: "12.mp3", title: "采石", lyricFile: "12.lrc", cover: "12.jpg", message: "炸裂岩石，填平山谷" },
        13: { file: "13.mp3", title: "山雀", lyricFile: "13.lrc", cover: "13.jpg", message: "树冠微风，肩头暴雨" },
        14: { file: "14.mp3", title: "绕越", lyricFile: "14.lrc", cover: "14.jpg", message: "绕过前人的悲喜" },
        15: { file: "15.mp3", title: "郊眠寺", lyricFile: "15.lrc", cover: "15.jpg", message: "郊外安眠的钟声" },
        16: { file: "16.mp3", title: "河北墨麒麟", lyricFile: "16.lrc", cover: "16.jpg", message: "墨麒麟在云端睁眼，祝你永远年轻" },
        17: { file: "17.mp3", title: "张洲", lyricFile: "17.lrc", cover: "17.jpg", message: "献给张洲，愿你自由如风" }
    };

    const defaultCover = "cover.jpg";

    function getSongId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('song');
    }

    let currentSongId = null;
    let audio = null;
    let isPlaying = false;
    let currentLyrics = [];
    let lyricsTimer = null;

    const coverImg = document.getElementById('coverImg');
    const songTitleEl = document.getElementById('songTitle');
    const bandEl = document.getElementById('band');
    const messageBox = document.getElementById('messageBox');
    const lyricContainer = document.getElementById('lyricContainer');
    const playBtn = document.getElementById('playBtn');
    const vinylDisc = document.getElementById('vinylDisc');
    const statusEl = document.getElementById('statusMsg');

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function parseLrc(lrcContent) {
        const lyrics = [];
        const lines = lrcContent.split(/\r?\n/);
        const timeRegex = /\[(\d{2}):(\d{2})(?:\.|:)(\d{2,3})\]/;
        for (let line of lines) {
            const match = line.match(timeRegex);
            if (match) {
                const minutes = parseInt(match[1], 10);
                const seconds = parseInt(match[2], 10);
                let millis = parseInt(match[3], 10);
                if (millis < 100) millis *= 10;
                const time = minutes * 60 + seconds + millis / 1000;
                const text = line.substring(line.lastIndexOf(']') + 1).trim();
                if (text) lyrics.push({ time, text });
            }
        }
        lyrics.sort((a, b) => a.time - b.time);
        return lyrics;
    }

    async function loadLyrics(lyricFile) {
        if (!lyricFile) return false;
        try {
            const resp = await fetch(lyricFile);
            if (!resp.ok) throw new Error();
            const lrcText = await resp.text();
            currentLyrics = parseLrc(lrcText);
            renderLyrics(-1);
            return true;
        } catch (e) {
            lyricContainer.innerHTML = '<div class="lyric-line">暂无滚动歌词</div>';
            currentLyrics = [];
            return false;
        }
    }

    function renderLyrics(activeIndex) {
        if (!currentLyrics.length) {
            lyricContainer.innerHTML = '<div class="lyric-line">暂无滚动歌词</div>';
            return;
        }
        let html = '';
        for (let i = 0; i < currentLyrics.length; i++) {
            const activeClass = (i === activeIndex) ? 'active' : '';
            html += `<div class="lyric-line ${activeClass}" data-index="${i}">${escapeHtml(currentLyrics[i].text)}</div>`;
        }
        lyricContainer.innerHTML = html;
        if (activeIndex >= 0) {
            const activeEl = lyricContainer.querySelector(`.lyric-line[data-index="${activeIndex}"]`);
            if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function updateLyricsHighlight(currentTime) {
        if (!currentLyrics.length) return;
        let activeIndex = -1;
        for (let i = 0; i < currentLyrics.length; i++) {
            if (currentTime >= currentLyrics[i].time) activeIndex = i;
            else break;
        }
        const currentActive = lyricContainer.querySelector('.lyric-line.active');
        const currentIdx = currentActive ? parseInt(currentActive.dataset.index, 10) : -1;
        if (activeIndex !== currentIdx) renderLyrics(activeIndex);
    }

    function stopLyricsTimer() {
        if (lyricsTimer) { clearInterval(lyricsTimer); lyricsTimer = null; }
    }
    function startLyricsTimer() {
        if (lyricsTimer) stopLyricsTimer();
        lyricsTimer = setInterval(() => {
            if (audio && !audio.paused && currentLyrics.length) {
                updateLyricsHighlight(audio.currentTime);
            }
        }, 100);
    }

    async function loadSongInfo(songId) {
        const song = songs[songId];
        if (!song) {
            songTitleEl.innerText = "未知歌曲";
            messageBox.innerText = "请检查卡片编号";
            lyricContainer.innerHTML = '<div class="lyric-line">歌曲不存在</div>';
            return false;
        }
        songTitleEl.innerText = song.title;
        bandEl.innerText = "万能青年旅店";
        messageBox.innerText = song.message || "送给独一无二的你";
        const coverUrl = song.cover ? song.cover : defaultCover;
        coverImg.src = coverUrl;
        coverImg.onerror = () => { coverImg.src = defaultCover; };
        if (song.lyricFile) await loadLyrics(song.lyricFile);
        else { lyricContainer.innerHTML = '<div class="lyric-line">暂无滚动歌词</div>'; currentLyrics = []; }
        return true;
    }

    async function playSong(songId) {
        const song = songs[songId];
        if (!song) return;
        if (audio) {
            audio.pause();
            audio = null;
        }
        stopLyricsTimer();
        audio = new Audio(song.file);
        audio.preload = "auto";
        audio.onplaying = () => {
            isPlaying = true;
            playBtn.innerHTML = "⏸";
            vinylDisc.classList.add('spin');
            statusEl.innerText = `🎶 正在播放 ${song.title}`;
            startLyricsTimer();
        };
        audio.onpause = () => {
            isPlaying = false;
            playBtn.innerHTML = "▶";
            vinylDisc.classList.remove('spin');
            statusEl.innerText = `已暂停 · 点击继续`;
            stopLyricsTimer();
        };
        audio.onended = () => {
            isPlaying = false;
            playBtn.innerHTML = "▶";
            vinylDisc.classList.remove('spin');
            statusEl.innerText = `播放结束 · 再次触碰卡片`;
            stopLyricsTimer();
            renderLyrics(-1);
        };
        audio.onerror = () => {
            statusEl.innerText = `❌ 无法播放 ${song.title}，请检查文件`;
        };
        try {
            await audio.play();
        } catch (err) {
            statusEl.innerText = `点击播放按钮开始聆听`;
        }
    }

    function togglePlayPause() {
        if (!currentSongId) {
            statusEl.innerText = "请先触碰NFC卡片";
            return;
        }
        if (!audio) {
            playSong(currentSongId);
            return;
        }
        if (isPlaying) {
            audio.pause();
        } else {
            if (audio.ended) audio.currentTime = 0;
            audio.play().catch(e => statusEl.innerText = "播放失败，请重试");
        }
    }

    async function init() {
        const songParam = getSongId();
        if (songParam && songs[songParam]) {
            currentSongId = songParam;
            await loadSongInfo(currentSongId);
            await playSong(currentSongId);
        } else {
            songTitleEl.innerText = "触碰NFC卡片";
            messageBox.innerText = "将卡片靠近手机背部";
            lyricContainer.innerHTML = '<div class="lyric-line">等待卡片...</div>';
            statusEl.innerText = "请用NFC卡片触碰手机";
        }
    }

    playBtn.addEventListener('click', togglePlayPause);
    vinylDisc.addEventListener('click', togglePlayPause);
    init();
</script>
</body>
</html>
