<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>万能青年旅店 - 专属留声机</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.6);
            --bg-color: #121212;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #121212 100%);
            color: #eee;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 玻璃拟态卡片 */
        .player-card {
            margin-top: 40px;
            width: 90%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* 黑胶唱片封面 */
        .record-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
        }

        .record {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
            border: 5px solid #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* 旋转动画 */
            animation: spin 8s linear infinite;
            animation-play-state: paused; 
        }

        .record.playing {
            animation-play-state: running;
        }

        /* 黑胶纹理 */
        .record::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .record::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 专辑封面 (内嵌在黑胶中) */
        .cover-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333;
            z-index: 2;
        }

        /* 唱片机唱臂(装饰) */
        .tonearm {
            position: absolute;
            top: -10px;
            right: 0;
            width: 20px;
            height: 100px;
            background: linear-gradient(to right, #ccc, #fff, #ccc);
            transform-origin: top center;
            transform: rotate(-30deg);
            transition: transform 0.5s ease;
            border-radius: 10px;
            z-index: 3;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .record-container.playing .tonearm {
            transform: rotate(15deg);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 歌曲信息 */
        .song-title {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
        }

        .message {
            font-size: 14px;
            color: #aaa;
            font-style: italic;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        /* 文艺播放按钮 */
        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1f1f1f, #151515);
            box-shadow: 5px 5px 10px #0a0a0a, -5px -5px 10px #1e1e1e;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 20px;
            font-family: serif;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 20px;
        }

        .play-btn:active {
            box-shadow: inset 5px 5px 10px #0a0a0a, inset -5px -5px 10px #1e1e1e;
            color: #fff;
        }

        /* 滚动歌词区域 */
        .lyrics-container {
            width: 100%;
            height: 150px;
            overflow: hidden;
            position: relative;
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
        }

        .lyrics-scroll {
            position: absolute;
            top: 60px; /* 初始居中偏置 */
            width: 100%;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-align: center;
        }

        .lyric-line {
            padding: 8px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            min-height: 20px;
        }

        /* 当前歌词高亮发光特效 */
        .lyric-line.active {
            color: var(--gold);
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px var(--gold-glow), 0 0 20px var(--gold-glow);
            transform: scale(1.05);
        }

        /* 底部进度条 (极简) */
        .progress-bar {
            width: 80%;
            height: 2px;
            background: #333;
            margin-top: 20px;
            position: relative;
        }
        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 0.1s linear;
        }

    </style>
</head>
<body>

    <div class="player-card">
        <!-- 黑胶封面区 -->
        <div class="record-container" id="recordContainer">
            <div class="tonearm"></div>
            <div class="record" id="record">
                <img src="" alt="cover" class="cover-img" id="coverImg" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDgwIDgwIj48Y2lyY2xlIGN4PSI0MCIgY3k9IjQwIiByPSI0MCIgZmlsbD0iIzMzMyIvPjx0ZXh0IHg9IjQwIiB5PSI0NSIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzY2NiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+5peg5bCB6Z2iPC90ZXh0Pjwvc3ZnPg=='">
            </div>
        </div>

        <div class="song-title" id="songTitle">获取中...</div>
        <div class="message" id="songMessage"></div>

        <!-- 文艺播放按钮：奏 / 止 -->
        <div class="play-btn" id="playBtn">奏</div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 歌词区 -->
        <div class="lyrics-container">
            <div class="lyrics-scroll" id="lyricsScroll">
                <div class="lyric-line active">请点击“奏”开始聆听</div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 歌曲数据配置 ---
        const songs = {
            1: { title: "不万能的喜剧", file: "01.mp3", lrc: "01.lrc", cover: "01.jpg", msg: "田恒搏，生日快乐" },
            2: { title: "大石碎胸口", file: "02.mp3", lrc: "02.lrc", cover: "02.jpg", msg: "敬一杯酒，给这漫长的白日梦。" },
            3: { title: "狗尿馆", file: "03.mp3", lrc: "03.lrc", cover: "03.jpg", msg: "荒诞与真实交织的角落。" },
            4: { title: "揪心的玩笑与漫长的白日梦", file: "04.mp3", lrc: "04.lrc", cover: "04.jpg", msg: "是谁来自山川湖海，却囿于昼夜，厨房与爱。" },
            5: { title: "秦皇岛", file: "05.mp3", lrc: "05.lrc", cover: "05.jpg", msg: "那个能照亮黑暗的号角声。" },
            6: { title: "杀死那个石家庄人", file: "06.mp3", lrc: "06.lrc", cover: "06.jpg", msg: "云层深处的黑暗，如此平静。" },
            7: { title: "十万嬉皮", file: "07.mp3", lrc: "07.lrc", cover: "07.jpg", msg: "大梦一场的董二千先生。" },
            8: { title: "洋鸟消夏录", file: "08.mp3", lrc: "08.lrc", cover: "08.jpg", msg: "属于夏天的漫长与消散。" },
            9: { title: "早", file: "09.mp3", lrc: "09.lrc", cover: "09.jpg", msg: "清晨的第一声问候。" },
            10: { title: "泥河", file: "10.mp3", lrc: "10.lrc", cover: "10.jpg", msg: "渤海洗不净的，泥河来承担。" },
            11: { title: "平等云雾", file: "11.mp3", lrc: "11.lrc", cover: "11.jpg", msg: "众生都在这云雾之中。" },
            12: { title: "采石", file: "12.mp3", lrc: "12.lrc", cover: "12.jpg", msg: "捶打石头，捶打时间。" },
            13: { title: "山雀", file: "13.mp3", lrc: "13.lrc", cover: "13.jpg", msg: "自然而然，轻盈飞跃。" },
            14: { title: "绕越", file: "14.mp3", lrc: "14.lrc", cover: "14.jpg", msg: "跨越那些不可逾越的。" },
            15: { title: "郊眠寺", file: "15.mp3", lrc: "15.lrc", cover: "15.jpg", msg: "新语言，旧语言，星空与大地。" },
            16: { title: "河北墨麒麟", file: "16.mp3", lrc: "16.lrc", cover: "16.jpg", msg: "风云变幻中的巨兽呼吸。" },
            17: { title: "张洲", file: "17.mp3", lrc: "17.lrc", cover: "17.jpg", msg: "为你特意保留的一抹色彩。" }
        };

        // --- 2. 初始化逻辑 ---
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('song');
        const songData = songs[songId];

        const audio = new Audio();
        let lyricsArray = [];
        let isPlaying = false;

        const record = document.getElementById('record');
        const recordContainer = document.getElementById('recordContainer');
        const playBtn = document.getElementById('playBtn');
        const lyricsScroll = document.getElementById('lyricsScroll');
        const progressFill = document.getElementById('progressFill');

        if (songData) {
            document.getElementById('songTitle').innerText = songData.title;
            document.getElementById('songMessage').innerText = songData.msg;
            document.getElementById('coverImg').src = songData.cover;
            audio.src = songData.file;
            loadLyrics(songData.lrc);
        } else {
            document.getElementById('songTitle').innerText = "未找到歌曲";
            document.getElementById('songMessage').innerText = "请检查 NFC 卡片链接是否正确";
            playBtn.style.display = 'none';
        }

        // --- 3. 播放控制 ---
        playBtn.addEventListener('click', () => {
            if (!songData) return;
            
            if (audio.paused) {
                audio.play();
                isPlaying = true;
                playBtn.innerText = "止"; // 文艺的暂停符号
                record.classList.add('playing');
                recordContainer.classList.add('playing');
            } else {
                audio.pause();
                isPlaying = false;
                playBtn.innerText = "奏"; // 文艺的播放符号
                record.classList.remove('playing');
                recordContainer.classList.remove('playing');
            }
        });

        // 歌曲结束重置
        audio.addEventListener('ended', () => {
            isPlaying = false;
            playBtn.innerText = "奏";
            record.classList.remove('playing');
            recordContainer.classList.remove('playing');
            audio.currentTime = 0;
            lyricsScroll.style.transform = `translateY(0px)`;
            highlightLyric(0);
        });

        // 进度条与歌词同步
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
            }
            syncLyrics(audio.currentTime);
        });

        // --- 4. 歌词处理 ---
        async function loadLyrics(filename) {
            try {
                // 尝试获取本地 LRC 文件
                const response = await fetch(filename);
                if (!response.ok) throw new Error('无歌词文件');
                const text = await response.text();
                parseLrc(text);
            } catch (e) {
                console.log(e);
                lyricsArray = [{ time: 0, text: "暂无滚动歌词，请静静欣赏" }];
                renderLyrics();
            }
        }

        function parseLrc(text) {
            const lines = text.split('\n');
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            lyricsArray = [];

            lines.forEach(line => {
                const match = line.match(timeReg);
                if (match) {
                    const min = parseInt(match[1]);
                    const sec = parseInt(match[2]);
                    const ms = match[3].length === 2 ? parseInt(match[3]) * 10 : parseInt(match[3]);
                    const time = min * 60 + sec + ms / 1000;
                    const text = line.replace(timeReg, '').trim();
                    if (text) {
                        lyricsArray.push({ time, text });
                    }
                }
            });
            renderLyrics();
        }

        function renderLyrics() {
            lyricsScroll.innerHTML = '';
            lyricsArray.forEach((lyric, index) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = `line-${index}`;
                div.innerText = lyric.text;
                lyricsScroll.appendChild(div);
            });
        }

        let currentIndex = -1;
        function syncLyrics(currentTime) {
            if (lyricsArray.length === 0) return;

            let nextIndex = lyricsArray.findIndex(lrc => lrc.time > currentTime);
            if (nextIndex === -1) nextIndex = lyricsArray.length;
            const newIndex = nextIndex - 1;

            if (newIndex !== currentIndex && newIndex >= 0) {
                currentIndex = newIndex;
                highlightLyric(currentIndex);
            }
        }

        function highlightLyric(index) {
            const lines = document.querySelectorAll('.lyric-line');
            lines.forEach(line => line.classList.remove('active'));
            
            const activeLine = document.getElementById(`line-${index}`);
            if (activeLine) {
                activeLine.classList.add('active');
                // 自动滚动 (60px是初始偏移，36px是每行大致高度)
                const offset = 60 - (index * 36); 
                lyricsScroll.style.transform = `translateY(${offset}px)`;
            }
        }
    </script>
</body>
</html>
